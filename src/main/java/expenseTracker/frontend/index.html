<!DOCTYPE html>
<html>
    <head>
        <title>
            ExpenseTracker
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Your Personal ExpenseTracker:</h1>
        </header>
        <form id="expense-form">
            <label for="Description">Description</label>
            <input type="text" id="description" placeholder="Sunglasses" required>
            <label for="amount">Cost</label>
            <input type="number" id="amount" placeholder="99.95" step="0.05" required>
            <label for="category">Category</label>
            <select id="category">
                <option value="SHOPPING">Shopping</option>
                <option value="BILLS">Bills</option>
                <option value="GROCERIES">Groceries</option>
                <option value="RENT">Rent</option>
                <option value="CAR">Car</option>
                <option value="FREE_TIME">Free time</option>
                <option value="OTHERS">Others</option>
            </select>
            <label for="date">Date</label>
            <input type="date" id="date">
            <div class="buttons">
                <button id="submit" type="submit">Add Expense</button>
                <button id="reset" type="reset">Reset</button>
            </div>
        </form>
        <ul id="yearly-list"></ul>
        <ul id="monthly-list"></ul>
        <ul id="daily-list"></ul>
        <ul id="expense-list"></ul>
        <script src="script.js"></script>
    </body>
</html>
